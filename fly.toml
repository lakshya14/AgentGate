# fly.toml app configuration file generated for AgentGate

app = "agentgate-YOURNAMEHERE"  # Change this to a unique name!
primary_region = "bom"          # Mumbai region

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0      # This enables Scale-to-Zero

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
