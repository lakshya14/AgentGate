[project]
name = "agentgate"
version = "0.1.0"
description = "Autonomous GitHub issue triage agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "sqlalchemy>=2.0.20",
    "psycopg[binary]>=3.1.8",
    "psycopg-pool>=3.2.0",
    "pydantic-settings>=2.0.3",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    "langgraph>=0.0.26",
    "langchain-core>=0.1.30",
    "langchain-google-genai>=0.0.9",
    "pgvector>=0.2.5",
    "httpx>=0.27.0",
    "langgraph-checkpoint-postgres",
    "pynacl>=1.5.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "routers*"]

[tool.setuptools]
py-modules = ["main", "models", "schemas", "database", "dependencies", "config"]
